<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>VideoDL</title><style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#22252b;--line:#30343c;--text:#f4f5f7;--muted:#9299a5;--accent:#ff4b55;--green:#36c98f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:960px;margin:auto;padding:26px 20px 60px}.top,.taskshead,.tasktop,.taskmeta{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:38px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:21px}.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);display:grid;place-items:center}.status{font-size:12px;color:var(--green)}.hero{margin-bottom:26px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.7px}.hero h1{font-size:clamp(30px,6vw,46px);letter-spacing:-1.8px;line-height:1.12;margin:9px 0}.hero p,.muted,.meta,.count,.taskmeta,.empty{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}.label{font-size:13px;font-weight:700;display:block;margin-bottom:11px}.urlbox{display:flex;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:7px}.urlbox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);padding:8px}.primary{background:var(--accent);color:white;font-weight:750;border-radius:10px;padding:11px 19px}.primary:disabled{opacity:.5}.muted{font-size:12px;margin:10px 2px 0}.video{display:none;grid-template-columns:150px 1fr;gap:16px}.video img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:11px;background:#282b31}.video h2{font-size:17px;margin:0 0 7px}.meta{font-size:12px}.selectrow{display:flex;gap:10px;margin-top:16px}.selectrow select{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px}.taskshead{margin-bottom:14px}.taskshead h2{font-size:16px;margin:0}.task{padding:14px 0;border-top:1px solid var(--line)}.task:first-child{border:0;padding-top:0}.taskname{font-weight:650;overflow-wrap:anywhere}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#30343c;white-space:nowrap}.pill.ok{background:#173a30;color:#69e0b0}.pill.bad{background:#432329;color:#ff9ba2}.bar{height:5px;background:#30343c;border-radius:8px;overflow:hidden;margin:10px 0 7px}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}.taskmeta{font-size:11px}.task a{color:#ff8188;text-decoration:none;font-size:12px;font-weight:700}.empty{font-size:13px;padding:14px 0}.foot{text-align:center;color:#6f7682;font-size:11px;margin-top:30px}@media(max-width:580px){.wrap{padding:19px 14px 45px}.top{margin-bottom:28px}.urlbox{display:grid}.urlbox button{width:100%}.video{grid-template-columns:112px 1fr}.selectrow{flex-direction:column}.selectrow button{width:100%}.panel{padding:15px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><span class="logo">↓</span>VideoDL</div><div class="status">● 手机服务器在线</div></header><section class="hero"><div class="eyebrow">PERSONAL DOWNLOAD SERVER</div><h1>把链接，变成视频。</h1><p>粘贴视频地址，解析可用画质，然后下载到手机服务器。</p></section><section class="panel"><label class="label" for="url">视频链接</label><div class="urlbox"><input id="url" type="url" placeholder="粘贴视频链接，支持 yt-dlp 支持的网站"><button id="parse" class="primary">解析视频</button></div><div class="muted">仅下载你有权访问且允许下载的内容。</div></section><section id="video" class="panel video"><img id="cover" alt="封面"><div><h2 id="title"></h2><div id="meta" class="meta"></div><div class="selectrow"><select id="format"></select><button id="download" class="primary">开始下载</button></div></div></section><section class="panel"><div class="taskshead"><h2>下载任务</h2><span id="count" class="count">0 个任务</span></div><div id="tasks"><div class="empty">还没有下载任务</div></div></section><div class="foot">VideoDL · 本地处理，手机存储</div></main><script>
const $=s=>document.querySelector(s);let key=localStorage.getItem("videodl-key")||"",current=null;
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json","X-Access-Key":key,...opts.headers}});let d={};try{d=await r.json()}catch{}if(r.status===401)throw Error("访问密钥不正确");if(!r.ok||d.ok===false)throw Error(d.error||"请求失败");return d}
async function auth(){if(!key){key=prompt("请输入 Termux 启动时显示的 VideoDL 访问密钥")||"";if(key)localStorage.setItem("videodl-key",key)}if(!key)throw Error("需要访问密钥");await api("/api/auth/check")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function size(n){return n>1073741824?(n/1073741824).toFixed(2)+" GB":n>1048576?(n/1048576).toFixed(1)+" MB":Math.round(n/1024)+" KB"}
$("#parse").onclick=async()=>{let b=$("#parse");try{await auth();if(!$("#url").value.trim())throw Error("请先粘贴视频链接");b.disabled=true;b.textContent="解析中…";let d=await api("/api/extract",{method:"POST",body:JSON.stringify({url:$("#url").value.trim()})});current={url:$("#url").value.trim(),video:d.video};$("#cover").src=d.video.thumbnail||"";$("#title").textContent=d.video.title;$("#meta").textContent=[d.video.uploader,d.video.duration?Math.round(d.video.duration/60)+" 分钟":""].filter(Boolean).join(" · ");$("#format").innerHTML=d.video.formats.map(f=>'<option value="'+esc(f.format_id)+'">'+esc(f.label)+" · "+esc(f.ext)+(f.filesize?" · "+size(f.filesize):"")+(f.has_audio?"":" · 需合并音频")+"</option>").join("");$("#video").style.display="grid"}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent="解析视频"}};
$("#download").onclick=async()=>{try{await auth();if(!current)throw Error("请先解析视频");await api("/api/downloads",{method:"POST",body:JSON.stringify({url:current.url,format_id:$("#format").value})});await refresh();poll()}catch(e){alert(e.message)}};
async function refresh(){try{await auth();let d=await api("/api/tasks");$("#count").textContent=d.tasks.length+" 个任务";$("#tasks").innerHTML=d.tasks.length?d.tasks.map(t=>'<div class="task"><div class="tasktop"><div class="taskname">'+esc(t.filename||("任务 "+t.id))+'</div><span class="pill '+(t.status==="completed"?"ok":t.status==="failed"?"bad":"")+'">'+(t.status==="completed"?"已完成":t.status==="failed"?"失败":"下载中")+'</span></div><div class="bar"><i style="width:'+(t.progress||0)+'%"></i></div><div class="taskmeta"><span>'+esc(t.phase||"等待中")+(t.progress!=null?" · "+t.progress+"%":"")+'</span><span>'+(t.speed?size(t.speed)+"/s":"")+(t.eta!=null?" · 剩余 "+t.eta+" 秒":"")+'</span></div>'+(t.status==="completed"?'<a href="/api/files/'+t.id+'" class="filelink" data-id="'+t.id+'">下载文件 ↓</a>':(t.error?'<div style="color:#ff8d94;font-size:12px">'+esc(t.error)+'</div>':""))+'</div>').join(""):'<div class="empty">还没有下载任务</div>'}catch(e){console.warn(e)}}
document.addEventListener("click",async e=>{let a=e.target.closest(".filelink");if(!a)return;e.preventDefault();try{await auth();let r=await fetch(a.href,{headers:{"X-Access-Key":key}});if(!r.ok)throw Error("文件下载失败");let blob=await r.blob(),u=URL.createObjectURL(blob),link=document.createElement("a");link.href=u;link.download="VideoDL-"+a.dataset.id;link.click();URL.revokeObjectURL(u)}catch(err){alert(err.message)}});
function poll(){clearInterval(window.poller);window.poller=setInterval(async()=>{await refresh();let active=[...document.querySelectorAll(".pill")].some(x=>x.textContent==="下载中");if(!active)clearInterval(window.poller)},1800)}
refresh();poll();
</script></body></html>
